<html lang="es">
<head>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23131f38'/><path d='M65 75A35 35 0 1 1 50 15a35 35 0 0 0 15 60z' fill='%23d3ad6d'/></svg>">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#131f38;
  --navy-2:#1a2a4c;
  --navy-3:#22345c;
  --gold:#d3ad6d;
  --gold-light:#ecd9ae;
  --cream:#f1e9db;
  --ink:#28283a;
  --line:rgba(211,173,109,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Jost',sans-serif;
  background:var(--navy);
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%, #223662 0%, var(--navy) 60%);
  color:var(--cream);
  min-height:100vh;
}
/* ---------- header ---------- */
header{
  text-align:center;
  padding:34px 16px 18px;
  position:relative;
  overflow:hidden;
}
.stars{position:absolute;inset:0;pointer-events:none}
.stars span{position:absolute;color:var(--gold);opacity:.55;font-size:9px}
.moon{display:block;margin:0 auto 10px;width:30px;height:30px}
h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  font-size:clamp(30px,8vw,44px);
  letter-spacing:.34em;
  text-indent:.34em;
  color:var(--gold-light);
  line-height:1.05;
}
h1 small{
  display:block;
  font-size:.44em;
  letter-spacing:.52em;
  text-indent:.52em;
  font-weight:400;
  color:var(--gold);
  margin-top:6px;
}
.tagline{
  font-family:'Great Vibes',cursive;
  font-size:clamp(19px,5vw,24px);
  color:var(--gold);
  margin-top:12px;
  opacity:.92;
}
.hair{
  width:54px;height:1px;background:var(--line);
  margin:16px auto 0;position:relative;
}
.hair::after{
  content:'✦';position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  color:var(--gold);font-size:9px;
}
/* ---------- sticky controls ---------- */
.controls{
  position:sticky;top:0;z-index:40;
  background:rgba(19,31,56,.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(211,173,109,.18);
}
.controls-inner{
  padding:10px 14px 12px;
  display:flex;gap:8px;
  width:100%;
  margin:0 auto;
}
.search{
  flex:1;min-width:0;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  border-radius:999px;
  padding:10px 16px;
  color:var(--cream);
  font-family:'Jost',sans-serif;
  font-size:15px;
  font-weight:300;
  outline:none;
  transition:border-color .2s;
}
.search::placeholder{color:rgba(241,233,219,.45);letter-spacing:.04em}
.search:focus{border-color:var(--gold)}
.cat-btn{
  flex:0 0 auto;
  display:flex;align-items:center;gap:7px;
  font-family:'Jost',sans-serif;
  font-size:12.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:400;
  color:var(--navy);
  background:var(--gold);
  border:1px solid var(--gold);
  border-radius:999px;
  padding:0 16px;
  cursor:pointer;
  max-width:46vw;
}
.cat-btn .cur{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:500;
}
.cat-btn svg{flex:0 0 auto}
/* ---------- category panel ---------- */
.cat-panel{
  position:fixed;left:0;right:0;top:0;z-index:80;
  background:var(--navy-2);
  border-bottom:1px solid var(--line);
  max-height:80vh;overflow-y:auto;
  padding:18px 16px 22px;
  transform:translateY(-105%);
  transition:transform .28s cubic-bezier(.3,.8,.3,1);
  box-shadow:0 18px 44px rgba(0,0,0,.5);
}
.cat-panel.open{transform:translateY(0)}
.cat-panel .panel-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;font-size:18px;
  letter-spacing:.26em;text-indent:.26em;text-transform:uppercase;
  color:var(--gold-light);
  text-align:center;margin-bottom:16px;
}
.pills{
  display:flex;flex-wrap:wrap;gap:9px;justify-content:center;
  max-width:720px;margin:0 auto;
}
.pill{
  font-family:'Jost',sans-serif;
  font-size:12.5px;
  letter-spacing:.07em;
  text-transform:uppercase;
  font-weight:400;
  color:var(--gold-light);
  background:transparent;
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 15px;
  cursor:pointer;
  transition:all .2s;
}
.pill.active{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--navy);
  font-weight:500;
}
/* ---------- catalog ---------- */
main{padding:20px 14px 130px;max-width:1060px;margin:0 auto}
.cat-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  font-size:22px;
  letter-spacing:.22em;
  text-indent:.22em;
  text-transform:uppercase;
  color:var(--gold-light);
  text-align:center;
  margin:26px 0 4px;
}
.cat-count{
  text-align:center;
  font-size:12px;
  letter-spacing:.14em;
  color:rgba(241,233,219,.5);
  margin-bottom:18px;
  font-weight:300;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.card{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(211,173,109,.22);
  border-radius:14px;
  padding:12px 10px 12px;
  display:flex;flex-direction:column;
  text-align:center;
}
.arch{
  width:100%;
  aspect-ratio:4/5;
  border-radius:999px 999px 12px 12px;
  overflow:hidden;
  background:#fdfbf7;
  border:1px solid var(--line);
  margin-bottom:10px;
  position:relative;
}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
.arch .noimg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--navy-2);color:var(--gold);font-family:'Cormorant Garamond',serif;
  font-size:26px;letter-spacing:.1em;
}
.pname{
  font-size:13px;
  font-weight:400;
  line-height:1.35;
  color:var(--cream);
  letter-spacing:.02em;
  margin-bottom:6px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:2.7em;
}
.pprice{
  font-family:'Cormorant Garamond',serif;
  font-size:19px;
  font-weight:600;
  color:var(--gold);
  letter-spacing:.03em;
  margin-bottom:10px;
}
.actions{margin-top:auto;min-height:36px}
.add{
  width:100%;
  font-family:'Jost',sans-serif;
  font-size:12.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold-light);
  background:transparent;
  border:1px solid var(--gold);
  border-radius:999px;
  padding:8px 0;
  cursor:pointer;
  transition:all .2s;
}
.add:active{background:var(--gold);color:var(--navy)}
.stepper{
  display:flex;align-items:center;justify-content:space-between;
  border:1px solid var(--gold);
  border-radius:999px;
  overflow:hidden;
  background:rgba(211,173,109,.1);
}
.stepper button{
  width:38px;height:34px;
  background:transparent;border:none;
  color:var(--gold-light);
  font-size:19px;cursor:pointer;line-height:1;
}
.stepper button:active{background:var(--gold);color:var(--navy)}
.stepper .q{
  font-weight:500;font-size:14px;color:var(--gold-light);
  letter-spacing:.05em;
}
.empty{
  text-align:center;color:rgba(241,233,219,.55);
  font-weight:300;padding:60px 20px;letter-spacing:.05em;
}
/* ---------- floating buttons ---------- */
.cart-fab{
  position:fixed;right:16px;bottom:18px;z-index:60;
  background:var(--gold);
  color:var(--navy);
  border:none;border-radius:999px;
  padding:14px 22px;
  font-family:'Jost',sans-serif;
  font-size:14px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;
  box-shadow:0 6px 24px rgba(0,0,0,.45);
  cursor:pointer;
}
.cart-fab .badge{
  background:var(--navy);color:var(--gold-light);
  border-radius:999px;min-width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:500;padding:0 6px;
}
.wa-fab{
  position:fixed;left:16px;bottom:18px;z-index:60;
  width:52px;height:52px;
  border-radius:999px;
  background:var(--navy-2);
  border:1px solid var(--gold);
  color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(0,0,0,.45);
  cursor:pointer;
  text-decoration:none;
}
/* ---------- cart drawer ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(8,13,26,.6);
  z-index:70;opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:80;
  background:var(--cream);
  color:var(--ink);
  border-radius:22px 22px 0 0;
  max-height:86vh;
  display:flex;flex-direction:column;
  transform:translateY(105%);
  transition:transform .3s cubic-bezier(.3,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.drawer.open{transform:translateY(0)}
.drawer-head{
  text-align:center;padding:18px 20px 12px;
  border-bottom:1px solid rgba(19,31,56,.12);
  position:relative;
}
.drawer-head h2{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;font-size:20px;
  letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;
  color:var(--navy);
}
.drawer-head .script{
  font-family:'Great Vibes',cursive;font-size:17px;color:#a07c3c;margin-top:2px;
}
.close-x{
  position:absolute;right:14px;top:14px;
  background:none;border:none;font-size:22px;color:var(--navy);
  cursor:pointer;line-height:1;padding:6px;
}
.cart-items{overflow-y:auto;padding:8px 18px;flex:1}
.citem{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid rgba(19,31,56,.08);
}
.citem .thumb{
  width:52px;height:62px;flex:0 0 52px;
  border-radius:999px 999px 8px 8px;
  overflow:hidden;background:#fff;border:1px solid rgba(19,31,56,.12);
  display:flex;align-items:center;justify-content:center;
  color:#a07c3c;font-family:'Cormorant Garamond',serif;
}
.citem .thumb img{width:100%;height:100%;object-fit:cover}
.citem .info{flex:1;min-width:0}
.citem .info .n{
  font-size:13px;font-weight:400;line-height:1.3;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.citem .info .p{
  font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:16px;color:#a07c3c;margin-top:2px;
}
.qty{display:flex;align-items:center;gap:2px}
.qty button{
  width:30px;height:30px;border-radius:999px;
  border:1px solid rgba(19,31,56,.3);background:transparent;
  color:var(--navy);font-size:16px;cursor:pointer;line-height:1;
}
.qty span{min-width:26px;text-align:center;font-weight:500;font-size:14px}
.cart-empty{
  text-align:center;padding:44px 20px;color:rgba(19,31,56,.55);font-weight:300;
}
.clear-cart{
  display:block;margin:10px auto 2px;
  background:none;border:none;
  font-family:'Jost',sans-serif;
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(19,31,56,.55);
  text-decoration:underline;text-underline-offset:3px;
  cursor:pointer;
}
.drawer-foot{
  padding:12px 18px 18px;
  border-top:1px solid rgba(19,31,56,.12);
  background:var(--cream);
}
.total-row{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:12px;
}
.total-row .lbl{
  font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);
}
.total-row .amt{
  font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:26px;color:var(--navy);
}
.wa-btn{
  width:100%;
  background:var(--navy);
  color:var(--gold-light);
  border:none;border-radius:999px;
  padding:15px 0;
  font-family:'Jost',sans-serif;
  font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;
}
.wa-btn:disabled{opacity:.4}
/* ---------- footer ---------- */
footer{
  text-align:center;
  padding:34px 20px 120px;
  font-size:12px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:300;
}

/* ---------- MEDIA QUERIES (Ajustes Escritorio) ---------- */
@media(min-width:560px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:860px){
  .grid{grid-template-columns:repeat(4,1fr);gap:18px}
  
  /* Reducción del tamaño de la barra de búsqueda (aprox 70% del max-width de 1060px) */
  .controls-inner{
    max-width:742px;
  }
  
  /* Carrito lateral a la derecha con ancho del 50% */
  .drawer{
    left:auto;
    right:0;
    top:0;
    bottom:0;
    width:50%;
    max-width:500px; /* Previene un tamaño desproporcionado en ultra-wide */
    max-height:100vh;
    border-radius:22px 0 0 22px;
    transform:translateX(105%); /* Esconde hacia la derecha en lugar de hacia abajo */
  }
  .drawer.open{
    transform:translateX(0);
  }
}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .drawer,.overlay,.cat-panel,.pill,.add{transition:none}
}
</style>
</head>
<body>

<header>
  <div class="stars" aria-hidden="true">
    <span style="top:22%;left:12%">✦</span>
    <span style="top:48%;left:22%;font-size:6px">✦</span>
    <span style="top:18%;right:14%">✦</span>
    <span style="top:55%;right:24%;font-size:6px">✦</span>
  </div>
  <svg class="moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M19 14.5A8.5 8.5 0 0 1 9.5 5 8.5 8.5 0 1 0 19 14.5Z" stroke="#d3ad6d" stroke-width="1.2" fill="rgba(211,173,109,.15)"/>
  </svg>
  <h1>ALMA<small>TERAPIA</small></h1>
  <div class="tagline">aromas que transforman espacios</div>
  <div class="hair"></div>
</header>

<div class="controls">
  <div class="controls-inner">
    <input class="search" id="search" type="search" placeholder="Buscar..." autocomplete="off">
    <button class="cat-btn" id="catBtn" aria-haspopup="true" aria-expanded="false">
      <span class="cur" id="catCur">Todos</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="cat-panel" id="catPanel" role="menu" aria-label="Categorías">
  <div class="panel-title">Categorías</div>
  <div class="pills" id="pills"></div>
</div>

<main id="main"></main>

<footer>Bienestar para tu hogar, todos los días ✦</footer>

<a class="wa-fab" id="waDirect" aria-label="Escribinos por WhatsApp" target="_blank" rel="noopener">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.3-.7.8-.8 1-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.4-3c-.3-.4 0-.5.1-.7l.4-.5c.1-.2.1-.3 0-.5s-.6-1.4-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1.1 2.7c.1.2 1.8 2.8 4.4 3.9.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.2-.2-.4-.3Z"/>
  </svg>
</a>

<button class="cart-fab" id="cartFab" aria-label="Ver carrito">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M6 7h12l-1.2 11a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 7Z" stroke="currentColor" stroke-width="1.6"/>
    <path d="M9 9V6a3 3 0 0 1 6 0v3" stroke="currentColor" stroke-width="1.6"/>
  </svg>
  Carrito
  <span class="badge" id="badge">0</span>
</button>

<div class="overlay" id="overlay"></div>

<div class="drawer" id="drawer" role="dialog" aria-label="Carrito de compras">
  <div class="drawer-head">
    <h2>Tu pedido</h2>
    <div class="script">para cada momento...</div>
    <button class="close-x" id="closeDrawer" aria-label="Cerrar">×</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="total-row">
      <span class="lbl">Total</span>
      <span class="amt" id="total">$0</span>
    </div>
    <button class="wa-btn" id="waBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.3-.7.8-.8 1-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.4-3c-.3-.4 0-.5.1-.7l.4-.5c.1-.2.1-.3 0-.5s-.6-1.4-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1.1 2.7c.1.2 1.8 2.8 4.4 3.9.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.2-.2-.4-.3Z"/>
      </svg>
      Pedir por WhatsApp
    </button>
    <button class="clear-cart" id="clearCart">Vaciar carrito</button>
  </div>
</div>

a 125ml", "pr": 10300, "img": "https://cdn.v2.tiendanegocio.com/gallery/20826/img_20826_dpku140b0mhdesoc7.png"}, {"id": 2512626, "n": "Aerosol Aromanza 280ml", "pr": 7500, "img": "https://cdn.v2.tiendanegocio.com/gallery/20826/img_20826_dpkuzfl5mgqorj1r.webp"}, {"id": 2477522, "n": "HUMIDIFICADOR H20 Luz", "pr": 15000, "img": "https://cdn.v2.tiendanegocio.com/gallery/20826/img_20826_dpku117r3mgvfzio5.png"}]}]};

const fmt = n => "$" + n.toLocaleString("es-AR");
const cart = new Map(); // id -> {p, qty}
const productIndex = new Map();
DATA.categories.forEach(c => c.products.forEach(p => { if(!productIndex.has(p.id)) productIndex.set(p.id, p); }));

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

/* ----- category panel ----- */
const catPanel = document.getElementById("catPanel");
const pillsEl = document.getElementById("pills");
const catBtn = document.getElementById("catBtn");
let activeCat = "__all__";
let panelOpen = false;

function buildPills(){
  const cats = [{slug:"__all__", cat:"Todos"}, ...DATA.categories];
  pillsEl.innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "pill" + (c.slug === activeCat ? " active" : "");
    b.textContent = c.cat;
    b.onclick = () => {
      activeCat = c.slug;
      document.getElementById("catCur").textContent = c.cat;
      document.getElementById("search").value = "";
      buildPills();
      togglePanel(false);
      render();
      window.scrollTo({top:0});
    };
    pillsEl.appendChild(b);
  });
}
function togglePanel(open){
  panelOpen = open === undefined ? !panelOpen : open;
  catPanel.classList.toggle("open", panelOpen);
  overlay.classList.toggle("open", panelOpen || drawerOpen);
  catBtn.setAttribute("aria-expanded", panelOpen);
}
catBtn.onclick = () => togglePanel();

/* ----- catalog render ----- */
const mainEl = document.getElementById("main");

function actionsHTML(p){
  const item = cart.get(p.id);
  if(!item){
    return `<button class="add" data-add="${p.id}">Agregar</button>`;
  }
  return `<div class="stepper">
    <button data-minus="${p.id}" aria-label="Quitar uno">−</button>
    <span class="q">${item.qty}</span>
    <button data-plus="${p.id}" aria-label="Agregar uno">+</button>
  </div>`;
}
function cardHTML(p){
  const img = p.img
    ? `<img src="${p.img}" alt="${esc(p.n)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;noimg&quot;>✦</div>'">`
    : `<div class="noimg">✦</div>`;
  return `<div class="card">
    <div class="arch">${img}</div>
    <div class="pname">${esc(p.n)}</div>
    <div class="pprice">${fmt(p.pr)}</div>
    <div class="actions" data-actions="${p.id}">${actionsHTML(p)}</div>
  </div>`;
}
function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  let html = "";
  if(q){
    const seen = new Set(); const results = [];
    DATA.categories.forEach(c => c.products.forEach(p => {
      if(!seen.has(p.id) && p.n.toLowerCase().includes(q)){ seen.add(p.id); results.push(p); }
    }));
    html += `<div class="cat-title">Resultados</div><div class="cat-count">${results.length} producto${results.length===1?"":"s"}</div>`;
    html += results.length
      ? `<div class="grid">${results.map(cardHTML).join("")}</div>`
      : `<div class="empty">No encontramos productos con ese nombre.<br>Probá con otra palabra.</div>`;
  } else {
    const cats = activeCat === "__all__" ? DATA.categories : DATA.categories.filter(c => c.slug === activeCat);
    cats.forEach(c => {
      if(!c.products.length) return;
      html += `<div class="cat-title">${esc(c.cat)}</div><div class="cat-count">${c.count} productos</div>`;
      html += `<div class="grid">${c.products.map(cardHTML).join("")}</div>`;
    });
  }
  mainEl.innerHTML = html;
}
/* update every visible copy of a product's controls (a product can be in several categories) */
function refreshActions(id){
  const p = productIndex.get(id);
  document.querySelectorAll(`[data-actions="${id}"]`).forEach(el => { el.innerHTML = actionsHTML(p); });
  updateBadge();
}
function addOne(id){
  const item = cart.get(id);
  if(item) item.qty++;
  else cart.set(id, { p: productIndex.get(id), qty: 1 });
  refreshActions(id);
}
function removeOne(id){
  const item = cart.get(id);
  if(!item) return;
  item.qty--;
  if(item.qty <= 0) cart.delete(id);
  refreshActions(id);
}
mainEl.addEventListener("click", e => {
  const add = e.target.closest("[data-add]");
  if(add){ addOne(Number(add.dataset.add)); return; }
  const plus = e.target.closest("[data-plus]");
  if(plus){ addOne(Number(plus.dataset.plus)); return; }
  const minus = e.target.closest("[data-minus]");
  if(minus){ removeOne(Number(minus.dataset.minus)); }
});

/* ----- search ----- */
document.getElementById("search").addEventListener("input", () => {
  const has = document.getElementById("search").value.trim();
  if(has && activeCat !== "__all__"){
    activeCat = "__all__";
    document.getElementById("catCur").textContent = "Todos";
    buildPills();
  }
  render();
});

/* ----- cart drawer ----- */
const overlay = document.getElementById("overlay");
const drawer = document.getElementById("drawer");
let drawerOpen = false;

function updateBadge(){
  let n = 0; cart.forEach(i => n += i.qty);
  document.getElementById("badge").textContent = n;
}
function renderCart(){
  const box = document.getElementById("cartItems");
  if(cart.size === 0){
    box.innerHTML = `<div class="cart-empty">Tu carrito está vacío.<br>Agregá productos para armar tu pedido.</div>`;
  } else {
    let html = "";
    cart.forEach(({p, qty}) => {
      const img = p.img ? `<img src="${p.img}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith('✦')">` : "✦";
      html += `<div class="citem">
        <div class="thumb">${img}</div>
        <div class="info">
          <div class="n">${esc(p.n)}</div>
          <div class="p">${fmt(p.pr)}</div>
        </div>
        <div class="qty">
          <button data-act="minus" data-id="${p.id}" aria-label="Quitar uno">−</button>
          <span>${qty}</span>
          <button data-act="plus" data-id="${p.id}" aria-label="Agregar uno">+</button>
        </div>
      </div>`;
    });
    box.innerHTML = html;
  }
  let total = 0; cart.forEach(({p, qty}) => total += p.pr * qty);
  document.getElementById("total").textContent = fmt(total);
  document.getElementById("waBtn").disabled = cart.size === 0;
  document.getElementById("clearCart").style.display = cart.size === 0 ? "none" : "block";
  updateBadge();
}
document.getElementById("cartItems").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if(!btn) return;
  const id = Number(btn.dataset.id);
  if(btn.dataset.act === "plus") addOne(id); else removeOne(id);
  renderCart();
});
document.getElementById("clearCart").onclick = () => {
  const ids = [...cart.keys()];
  cart.clear();
  ids.forEach(refreshActions);
  renderCart();
};
function openDrawer(){ drawerOpen = true; renderCart(); overlay.classList.add("open"); drawer.classList.add("open"); }
function closeDrawer(){ drawerOpen = false; drawer.classList.remove("open"); if(!panelOpen) overlay.classList.remove("open"); }
document.getElementById("cartFab").onclick = () => { togglePanel(false); openDrawer(); };
document.getElementById("closeDrawer").onclick = closeDrawer;
overlay.onclick = () => { closeDrawer(); togglePanel(false); };

/* ----- whatsapp ----- */
document.getElementById("waDirect").href =
  "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent("¡Hola Alma Terapia! 🌙 Quiero hacerles una consulta.");

document.getElementById("waBtn").onclick = () => {
  if(cart.size === 0) return;
  let lines = ["¡Hola Alma Terapia! 🌙 Quiero hacer este pedido:", ""];
  let total = 0;
  cart.forEach(({p, qty}) => {
    const sub = p.pr * qty;
    total += sub;
    // Se cambia el símbolo conflictivo por un simple guion y se elimina el guion largo por ':' para 100% de compatibilidad
    lines.push(`- ${qty} x ${p.n} : ${fmt(sub)}`);
  });
  lines.push("", `*Total: ${fmt(total)}*`);
  const url = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(lines.join("\n"));
  window.open(url, "_blank");
};

buildPills();
render();
updateBadge();
</script>
