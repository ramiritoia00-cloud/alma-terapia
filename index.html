<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="keywords" content="Alma Terapia, aromaterapia, Corrientes Capital, sahumerios, Sagrada Madre, Aromanza, difusores, lámparas de sal, velas, decoración, bienestar, esencias">

<!-- Favicon SVG: Luna dorada en fondo azul -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23131f38'/><path d='M65 75A35 35 0 1 1 50 15a35 35 0 0 0 15 60z' fill='%23d3ad6d'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#131f38;
  --navy-2:#1a2a4c;
  --navy-3:#22345c;
  --gold:#d3ad6d;
  --gold-light:#ecd9ae;
  --cream:#f1e9db;
  --ink:#28283a;
  --line:rgba(211,173,109,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Jost',sans-serif;
  background:var(--navy);
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%, #223662 0%, var(--navy) 60%);
  color:var(--cream);
  min-height:100vh;
}
/* ---------- header ---------- */
header{
  text-align:center;
  padding:34px 16px 18px;
  position:relative;
  overflow:hidden;
}
.stars{position:absolute;inset:0;pointer-events:none}
.stars span{position:absolute;color:var(--gold);opacity:.55;font-size:9px}
.moon{display:block;margin:0 auto 10px;width:30px;height:30px}
h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  font-size:clamp(30px,8vw,44px);
  letter-spacing:.34em;
  text-indent:.34em;
  color:var(--gold-light);
  line-height:1.05;
}
h1 small{
  display:block;
  font-size:.44em;
  letter-spacing:.52em;
  text-indent:.52em;
  font-weight:400;
  color:var(--gold);
  margin-top:6px;
}
.tagline{
  font-family:'Great Vibes',cursive;
  font-size:clamp(19px,5vw,24px);
  color:var(--gold);
  margin-top:12px;
  opacity:.92;
}
.hair{
  width:54px;height:1px;background:var(--line);
  margin:16px auto 0;position:relative;
}
.hair::after{
  content:'✦';position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  color:var(--gold);font-size:9px;
}
/* ---------- sticky controls (dos filas) ---------- */
.controls{
  position:sticky;top:0;z-index:40;
  background:rgba(19,31,56,.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(211,173,109,.18);
}
.controls-inner{
  padding:10px 14px 12px;
  width:100%;
  max-width:742px;
  margin:0 auto;
}
/* Fila superior: búsqueda + carrito */
.controls-row{
  display:flex;gap:8px;align-items:center;
}
/* Fila inferior: categorías + orden, centradas y simétricas */
.controls-row2{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:26px;
  margin-top:10px;
}
.search{
  flex:1;min-width:0;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  border-radius:999px;
  padding:10px 16px;
  color:var(--cream);
  font-family:'Jost',sans-serif;
  font-size:15px;
  font-weight:300;
  outline:none;
  transition:border-color .2s;
}
.search::placeholder{color:rgba(241,233,219,.45);letter-spacing:.04em}
.search:focus{border-color:var(--gold)}
/* Botón carrito en el menú superior */
.cart-top{
  flex:0 0 auto;
  position:relative;
  width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold);
  border:1px solid var(--gold);
  border-radius:999px;
  color:var(--navy);
  cursor:pointer;
  transition:transform .15s;
}
.cart-top:active{transform:scale(.94)}
.cart-top .badge{
  position:absolute;top:-5px;right:-5px;
  background:var(--navy);color:var(--gold-light);
  border:1px solid var(--gold);
  border-radius:999px;min-width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:500;padding:0 5px;
  line-height:1;
}
/* Animación pulse/glow para reencontrar el carrito */
@keyframes cartPulse{
  0%{box-shadow:0 0 0 0 rgba(211,173,109,.65);transform:scale(1)}
  45%{box-shadow:0 0 0 12px rgba(211,173,109,0);transform:scale(1.14)}
  100%{box-shadow:0 0 0 0 rgba(211,173,109,0);transform:scale(1)}
}
.cart-top.pulse{
  animation:cartPulse .62s ease-in-out 2;
}
.cat-btn{
  flex:0 0 auto;
  display:flex;align-items:center;gap:7px;
  font-family:'Jost',sans-serif;
  font-size:12.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:400;
  color:var(--navy);
  background:var(--gold);
  border:1px solid var(--gold);
  border-radius:999px;
  padding:9px 18px;
  cursor:pointer;
  max-width:52vw;
}
.cat-btn .cur{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:500;
}
.cat-btn svg{flex:0 0 auto}
/* Selector de orden */
.sort{
  flex:0 0 auto;
  appearance:none;-webkit-appearance:none;
  background:transparent;
  border:none;
  color:var(--gold-light);
  font-family:'Jost',sans-serif;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:300;
  padding:6px 20px 6px 6px;
  outline:none;cursor:pointer;
  max-width:52vw;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='9' viewBox='0 0 24 24' fill='none'><path d='M6 9l6 6 6-6' stroke='%23d3ad6d' stroke-width='2.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 2px center;
}
.sort option{background:var(--navy-2);color:var(--cream)}
/* ---------- category panel ---------- */
.cat-panel{
  position:fixed;left:0;right:0;top:0;z-index:80;
  background:var(--navy-2);
  border-bottom:1px solid var(--line);
  max-height:80vh;overflow-y:auto;
  padding:18px 16px 22px;
  transform:translateY(-105%);
  transition:transform .28s cubic-bezier(.3,.8,.3,1);
  box-shadow:0 18px 44px rgba(0,0,0,.5);
}
.cat-panel.open{transform:translateY(0)}
.cat-panel .panel-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;font-size:18px;
  letter-spacing:.26em;text-indent:.26em;text-transform:uppercase;
  color:var(--gold-light);
  text-align:center;margin-bottom:16px;
}
.pills{
  display:flex;flex-wrap:wrap;gap:9px;justify-content:center;
  max-width:720px;margin:0 auto;
}
.pill{
  font-family:'Jost',sans-serif;
  font-size:12.5px;
  letter-spacing:.07em;
  text-transform:uppercase;
  font-weight:400;
  color:var(--gold-light);
  background:transparent;
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 15px;
  cursor:pointer;
  transition:all .2s;
}
.pill.active{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--navy);
  font-weight:500;
}
/* ---------- catalog ---------- */
main{padding:20px 14px 130px;max-width:1060px;margin:0 auto}
.cat-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:500;
  font-size:22px;
  letter-spacing:.22em;
  text-indent:.22em;
  text-transform:uppercase;
  color:var(--gold-light);
  text-align:center;
  margin:26px 0 4px;
}
.cat-count{
  text-align:center;
  font-size:12px;
  letter-spacing:.14em;
  color:rgba(241,233,219,.5);
  margin-bottom:18px;
  font-weight:300;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.card{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(211,173,109,.22);
  border-radius:14px;
  padding:12px 10px 12px;
  display:flex;flex-direction:column;
  text-align:center;
}
.arch{
  width:100%;
  aspect-ratio:4/5;
  border-radius:999px 999px 12px 12px;
  overflow:hidden;
  background:#fdfbf7;
  border:1px solid var(--line);
  margin-bottom:10px;
  position:relative;
}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
.arch .noimg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--navy-2);color:var(--gold);font-family:'Cormorant Garamond',serif;
  font-size:26px;letter-spacing:.1em;
}
/* Etiqueta de aromas sobre la imagen (refinada) */
.vtag{
  position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  background:rgba(19,31,56,.82);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  color:var(--gold-light);
  font-family:'Jost',sans-serif;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px 11px;white-space:nowrap;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
}
.pname{
  font-size:13px;
  font-weight:400;
  line-height:1.35;
  color:var(--cream);
  letter-spacing:.02em;
  margin-bottom:6px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:2.7em;
}
.pprice{
  font-family:'Cormorant Garamond',serif;
  font-size:19px;
  font-weight:600;
  color:var(--gold);
  letter-spacing:.03em;
  margin-bottom:10px;
}
.actions{margin-top:auto;min-height:36px}
.add{
  width:100%;
  font-family:'Jost',sans-serif;
  font-size:12.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold-light);
  background:transparent;
  border:1px solid var(--gold);
  border-radius:999px;
  padding:8px 0;
  cursor:pointer;
  transition:all .2s;
}
.add:active{background:var(--gold);color:var(--navy)}
.stepper{
  display:flex;align-items:center;justify-content:space-between;
  border:1px solid var(--gold);
  border-radius:999px;
  overflow:hidden;
  background:rgba(211,173,109,.1);
}
.stepper button{
  width:38px;height:34px;
  background:transparent;border:none;
  color:var(--gold-light);
  font-size:19px;cursor:pointer;line-height:1;
}
.stepper button:active{background:var(--gold);color:var(--navy)}
.stepper .q{
  font-weight:500;font-size:14px;color:var(--gold-light);
  letter-spacing:.05em;
}
.empty{
  text-align:center;color:rgba(241,233,219,.55);
  font-weight:300;padding:60px 20px;letter-spacing:.05em;
}
/* ---------- floating button: WhatsApp (abajo a la derecha) ---------- */
.wa-fab{
  position:fixed;right:16px;bottom:18px;z-index:60;
  width:54px;height:54px;
  border-radius:999px;
  background:var(--navy-2);
  border:1px solid var(--gold);
  color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(0,0,0,.45);
  cursor:pointer;
  text-decoration:none;
}
/* ---------- overlay / cart drawer ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(8,13,26,.6);
  z-index:70;opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:80;
  background:var(--cream);
  color:var(--ink);
  border-radius:22px 22px 0 0;
  max-height:86vh;
  display:flex;flex-direction:column;
  transform:translateY(105%);
  transition:transform .3s cubic-bezier(.3,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.drawer.open{transform:translateY(0)}
.drawer-head{
  text-align:center;padding:18px 20px 12px;
  border-bottom:1px solid rgba(19,31,56,.12);
  position:relative;
}
.drawer-head h2{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;font-size:20px;
  letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;
  color:var(--navy);
}
.drawer-head .script{
  font-family:'Great Vibes',cursive;font-size:17px;color:#a07c3c;margin-top:2px;
}
.close-x{
  position:absolute;right:14px;top:14px;
  background:none;border:none;font-size:22px;color:var(--navy);
  cursor:pointer;line-height:1;padding:6px;
}
.cart-items{overflow-y:auto;padding:8px 18px;flex:1}
.citem{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid rgba(19,31,56,.08);
}
.citem .thumb{
  width:52px;height:62px;flex:0 0 52px;
  border-radius:999px 999px 8px 8px;
  overflow:hidden;background:#fff;border:1px solid rgba(19,31,56,.12);
  display:flex;align-items:center;justify-content:center;
  color:#a07c3c;font-family:'Cormorant Garamond',serif;
}
.citem .thumb img{width:100%;height:100%;object-fit:cover}
.citem .info{flex:1;min-width:0}
.citem .info .n{
  font-size:13px;font-weight:400;line-height:1.3;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.citem .info .n em{font-style:normal;color:#a07c3c}
.citem .info .p{
  font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:16px;color:#a07c3c;margin-top:2px;
}
.qty{display:flex;align-items:center;gap:2px}
.qty button{
  width:30px;height:30px;border-radius:999px;
  border:1px solid rgba(19,31,56,.3);background:transparent;
  color:var(--navy);font-size:16px;cursor:pointer;line-height:1;
}
.qty span{min-width:26px;text-align:center;font-weight:500;font-size:14px}
.cart-empty{
  text-align:center;padding:44px 20px;color:rgba(19,31,56,.55);font-weight:300;
}
.clear-cart{
  display:block;margin:10px auto 2px;
  background:none;border:none;
  font-family:'Jost',sans-serif;
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(19,31,56,.55);
  text-decoration:underline;text-underline-offset:3px;
  cursor:pointer;
}
.drawer-foot{
  padding:12px 18px 18px;
  border-top:1px solid rgba(19,31,56,.12);
  background:var(--cream);
}
.total-row{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:8px;
}
.total-row .lbl{
  font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);
}
.total-row .amt{
  font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:26px;color:var(--navy);
}
.avail-note{
  text-align:center;font-size:12px;font-weight:300;line-height:1.45;
  color:rgba(19,31,56,.65);margin-bottom:12px;
}
.wa-btn{
  width:100%;
  background:var(--navy);
  color:var(--gold-light);
  border:none;border-radius:999px;
  padding:15px 0;
  font-family:'Jost',sans-serif;
  font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;
}
.wa-btn:disabled{opacity:.4}
/* Botón "Seguir comprando" */
.keep-shopping{
  width:100%;
  margin-top:10px;
  background:transparent;
  color:var(--navy);
  border:1px solid var(--navy);
  border-radius:999px;
  padding:12px 0;
  font-family:'Jost',sans-serif;
  font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:9px;
  cursor:pointer;
  transition:all .2s;
}
.keep-shopping:active{background:var(--navy);color:var(--gold-light)}
.keep-shopping svg{flex:0 0 auto}
/* ---------- variant modal ---------- */
.vmodal{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  background:var(--cream);color:var(--ink);
  border-radius:22px 22px 0 0;
  max-height:80vh;display:flex;flex-direction:column;
  transform:translateY(105%);
  transition:transform .28s cubic-bezier(.3,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.vmodal.open{transform:translateY(0)}
.vmodal-head{text-align:center;padding:18px 46px 10px;position:relative;border-bottom:1px solid rgba(19,31,56,.12)}
.vmodal-head .vh-title{
  font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px;
  letter-spacing:.18em;text-indent:.18em;text-transform:uppercase;color:var(--navy);
}
.vmodal-head .vh-sub{font-family:'Great Vibes',cursive;font-size:16px;color:#a07c3c;margin-top:2px}
.vmodal-head .vh-name{font-size:13px;font-weight:400;color:rgba(19,31,56,.7);margin-top:6px;line-height:1.3}
.vlist{overflow-y:auto;padding:14px 18px;display:flex;flex-wrap:wrap;gap:9px;justify-content:center;align-content:flex-start}
.vopt{
  font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.04em;
  color:var(--navy);background:#fff;
  border:1px solid rgba(19,31,56,.25);
  border-radius:999px;padding:9px 16px;cursor:pointer;transition:all .15s;
}
.vopt:active{background:rgba(211,173,109,.18)}
.vopt.sel{background:var(--navy);color:var(--gold-light);border-color:var(--navy);font-weight:500}
.vfoot{padding:12px 18px 18px;border-top:1px solid rgba(19,31,56,.12)}
.vconfirm{
  width:100%;background:var(--navy);color:var(--gold-light);
  border:none;border-radius:999px;padding:14px 0;
  font-family:'Jost',sans-serif;font-size:13.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
}
.vconfirm:disabled{opacity:.4}
/* ---------- footer ---------- */
footer{
  text-align:center;
  padding:34px 20px 120px;
  font-size:12px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:300;
}

/* ---------- MEDIA QUERIES (Ajustes Escritorio) ---------- */
@media(min-width:560px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:860px){
  .grid{grid-template-columns:repeat(4,1fr);gap:18px}

  /* Carrito lateral a la derecha con ancho del 50% */
  .drawer{
    left:auto;
    right:0;
    top:0;
    bottom:0;
    width:50%;
    max-width:500px; /* Previene un tamaño desproporcionado en ultra-wide */
    max-height:100vh;
    border-radius:22px 0 0 22px;
    transform:translateX(105%); /* Esconde hacia la derecha en lugar de hacia abajo */
  }
  .drawer.open{
    transform:translateX(0);
  }
}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .drawer,.overlay,.cat-panel,.vmodal,.pill,.add{transition:none}
  .cart-top.pulse{animation:none}
}
</style>
</head>
<body>

<header>
  <div class="stars" aria-hidden="true">
    <span style="top:22%;left:12%">✦</span>
    <span style="top:48%;left:22%;font-size:6px">✦</span>
    <span style="top:18%;right:14%">✦</span>
    <span style="top:55%;right:24%;font-size:6px">✦</span>
  </div>
  <svg class="moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M19 14.5A8.5 8.5 0 0 1 9.5 5 8.5 8.5 0 1 0 19 14.5Z" stroke="#d3ad6d" stroke-width="1.2" fill="rgba(211,173,109,.15)"/>
  </svg>
  <h1>ALMA<small>TERAPIA</small></h1>
  <div class="tagline">aromas que transforman espacios</div>
  <div class="hair"></div>
</header>

<div class="controls">
  <div class="controls-inner">
    <!-- Fila superior: búsqueda + carrito -->
    <div class="controls-row">
      <input class="search" id="search" type="search" placeholder="Buscar..." autocomplete="off">

const fmt = n => "$" + n.toLocaleString("es-AR");
/* carrito: clave "id" o "id::variante" -> {p, variant, qty, seq} */
const cart = new Map();
let addSeq = 0;
const productIndex = new Map();
DATA.categories.forEach(c => c.products.forEach(p => { if(!productIndex.has(p.id)) productIndex.set(p.id, p); }));

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

/* ----- categorías ----- */
const catPanel = document.getElementById("catPanel");
const pillsEl = document.getElementById("pills");
const catBtn = document.getElementById("catBtn");
let activeCat = "__all__";
let panelOpen = false;

/* El botón dice "Categorías" por defecto (Todos) o el nombre de la categoría elegida */
function catLabel(slug, name){ return slug === "__all__" ? "Categorías" : name; }

function buildPills(){
  const cats = [{slug:"__all__", cat:"Todos"}, ...DATA.categories];
  pillsEl.innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "pill" + (c.slug === activeCat ? " active" : "");
    b.textContent = c.cat;
    b.onclick = () => {
      activeCat = c.slug;
      document.getElementById("catCur").textContent = catLabel(c.slug, c.cat);
      document.getElementById("search").value = "";
      buildPills();
      togglePanel(false);
      render();
      window.scrollTo({top:0});
    };
    pillsEl.appendChild(b);
  });
}
function togglePanel(open){
  panelOpen = open === undefined ? !panelOpen : open;
  catPanel.classList.toggle("open", panelOpen);
  syncOverlay();
  catBtn.setAttribute("aria-expanded", panelOpen);
}
catBtn.onclick = () => { closeVmodal(); closeDrawer(); togglePanel(); };

/* ----- orden ----- */
let sortMode = "rel";
document.getElementById("sort").addEventListener("change", e => {
  sortMode = e.target.value;
  render();
});
function sortList(list){
  const l = [...list];
  if(sortMode === "pa") l.sort((a,b) => a.pr - b.pr);
  else if(sortMode === "pd") l.sort((a,b) => b.pr - a.pr);
  else if(sortMode === "az") l.sort((a,b) => a.n.localeCompare(b.n, "es"));
  else if(sortMode === "za") l.sort((a,b) => b.n.localeCompare(a.n, "es"));
  return l;
}

/* ----- catálogo ----- */
const mainEl = document.getElementById("main");

function qtyOf(id){
  let n = 0;
  cart.forEach(item => { if(item.p.id === id) n += item.qty; });
  return n;
}
function actionsHTML(p){
  const q = qtyOf(p.id);
  if(q === 0) return `<button class="add" data-add="${p.id}">Agregar</button>`;
  return `<div class="stepper">
    <button data-minus="${p.id}" aria-label="Quitar uno">−</button>
    <span class="q">${q}</span>
    <button data-plus="${p.id}" aria-label="Agregar uno">+</button>
  </div>`;
}
function cardHTML(p){
  const img = p.img
    ? `<img src="${p.img}" alt="${esc(p.n)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;noimg&quot;>✦</div>'">`
    : `<div class="noimg">✦</div>`;
  const vtag = p.v && p.v.length ? `<div class="vtag">${p.v.length} aromas</div>` : "";
  return `<div class="card">
    <div class="arch">${img}${vtag}</div>
    <div class="pname">${esc(p.n)}</div>
    <div class="pprice">${fmt(p.pr)}</div>
    <div class="actions" data-actions="${p.id}">${actionsHTML(p)}</div>
  </div>`;
}
function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  let html = "";
  if(q){
    const seen = new Set(); const results = [];
    DATA.categories.forEach(c => c.products.forEach(p => {
      if(!seen.has(p.id) && p.n.toLowerCase().includes(q)){ seen.add(p.id); results.push(p); }
    }));
    const list = sortList(results);
    html += `<div class="cat-title">Resultados</div><div class="cat-count">${list.length} producto${list.length===1?"":"s"}</div>`;
    html += list.length
      ? `<div class="grid">${list.map(cardHTML).join("")}</div>`
      : `<div class="empty">No encontramos productos con ese nombre.<br>Probá con otra palabra.</div>`;
  } else {
    const cats = activeCat === "__all__" ? DATA.categories : DATA.categories.filter(c => c.slug === activeCat);
    cats.forEach(c => {
      if(!c.products.length) return;
      html += `<div class="cat-title">${esc(c.cat)}</div><div class="cat-count">${c.count} productos</div>`;
      html += `<div class="grid">${sortList(c.products).map(cardHTML).join("")}</div>`;
    });
  }
  mainEl.innerHTML = html;
}
function refreshActions(id){
  const p = productIndex.get(id);
  document.querySelectorAll(`[data-actions="${id}"]`).forEach(el => { el.innerHTML = actionsHTML(p); });
  updateBadge();
}
function keyOf(id, variant){ return variant ? id + "::" + variant : String(id); }
function addToCart(id, variant){
  const k = keyOf(id, variant);
  const item = cart.get(k);
  const isNewLine = !item;
  if(item) item.qty++;
  else cart.set(k, { p: productIndex.get(id), variant: variant || null, qty: 1, seq: ++addSeq });
  refreshActions(id);
  if(drawerOpen) renderCart();
  /* Apertura automática al agregar el primer producto o un producto nuevo (línea nueva) */
  if(isNewLine && !drawerOpen) openDrawer();
}
function removeOneFromProduct(id){
  /* quita 1 de la línea agregada más recientemente de ese producto */
  let target = null;
  cart.forEach((item, k) => {
    if(item.p.id === id && (!target || item.seq > cart.get(target).seq)) target = k;
  });
  if(!target) return;
  const item = cart.get(target);
  item.qty--;
  if(item.qty <= 0) cart.delete(target);
  refreshActions(id);
  if(drawerOpen) renderCart();
}
mainEl.addEventListener("click", e => {
  const add = e.target.closest("[data-add]");
  const plus = e.target.closest("[data-plus]");
  const minus = e.target.closest("[data-minus]");
  const id = add ? Number(add.dataset.add) : plus ? Number(plus.dataset.plus) : minus ? Number(minus.dataset.minus) : null;
  if(id === null) return;
  const p = productIndex.get(id);
  if(minus){ removeOneFromProduct(id); return; }
  /* agregar o sumar: si tiene variantes, abrir selector de aromas */
  if(p.v && p.v.length) openVmodal(p);
  else addToCart(id, null);
});

/* ----- selector de variantes / aromas ----- */
const vmodal = document.getElementById("vmodal");
let vmodalOpen = false;
let vProduct = null;
let vSelected = null;
function openVmodal(p){
  vProduct = p; vSelected = null;
  document.getElementById("vName").textContent = p.n + " — " + fmt(p.pr);
  const box = document.getElementById("vList");
  box.innerHTML = "";
  
  // Filtrar solo las variantes disponibles (av === true), o si ninguna está marcada, mostrar todas
  const availableVariants = (p.v && p.v.some(v => v.av === true)) ? p.v.filter(v => v.av === true) : p.v;

  availableVariants.forEach(v => {
    const b = document.createElement("button");
    b.className = "vopt";
    b.textContent = v.t;
    b.onclick = () => {
      vSelected = v.t;
      box.querySelectorAll(".vopt").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      document.getElementById("vConfirm").disabled = false;
    };
    box.appendChild(b);
  });
  document.getElementById("vConfirm").disabled = true;
  closeDrawer(); togglePanel(false);
  vmodalOpen = true;
  vmodal.classList.add("open");
  syncOverlay();
}
function closeVmodal(){
  vmodalOpen = false;
  vmodal.classList.remove("open");
  syncOverlay();
}
document.getElementById("closeVmodal").onclick = closeVmodal;
document.getElementById("vConfirm").onclick = () => {
  if(!vProduct || !vSelected) return;
  const id = vProduct.id, variant = vSelected;
  closeVmodal();
  addToCart(id, variant);
};

/* ----- buscador ----- */
document.getElementById("search").addEventListener("input", () => {
  const has = document.getElementById("search").value.trim();
  if(has && activeCat !== "__all__"){
    activeCat = "__all__";
    document.getElementById("catCur").textContent = "Categorías";
    buildPills();
  }
  render();
});

/* ----- carrito ----- */
const overlay = document.getElementById("overlay");
const drawer = document.getElementById("drawer");
const cartBtnTop = document.getElementById("cartBtnTop");
let drawerOpen = false;

function syncOverlay(){
  overlay.classList.toggle("open", drawerOpen || panelOpen || vmodalOpen);
}
function updateBadge(){
  let n = 0; cart.forEach(i => n += i.qty);
  document.getElementById("badge").textContent = n;
}
function renderCart(){
  const box = document.getElementById("cartItems");
  if(cart.size === 0){
    box.innerHTML = `<div class="cart-empty">Tu carrito está vacío.<br>Agregá productos para armar tu pedido.</div>`;
  } else {
    let html = "";
    cart.forEach(({p, variant, qty}, k) => {
      const img = p.img ? `<img src="${p.img}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith('✦')">` : "✦";
      const name = esc(p.n) + (variant ? ` <em>(${esc(variant)})</em>` : "");
      html += `<div class="citem">
        <div class="thumb">${img}</div>
        <div class="info">
          <div class="n">${name}</div>
          <div class="p">${fmt(p.pr)}</div>
        </div>
        <div class="qty">
          <button data-act="minus" data-key="${esc(k)}" aria-label="Quitar uno">−</button>
          <span>${qty}</span>
          <button data-act="plus" data-key="${esc(k)}" aria-label="Agregar uno">+</button>
        </div>
      </div>`;
    });
    box.innerHTML = html;
  }
  let total = 0; cart.forEach(({p, qty}) => total += p.pr * qty);
  document.getElementById("total").textContent = fmt(total);
  document.getElementById("waBtn").disabled = cart.size === 0;
  document.getElementById("clearCart").style.display = cart.size === 0 ? "none" : "block";
  updateBadge();
}
document.getElementById("cartItems").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if(!btn) return;
  const k = btn.dataset.key;
  const item = cart.get(k);
  if(!item) return;
  if(btn.dataset.act === "plus") item.qty++;
  else { item.qty--; if(item.qty <= 0) cart.delete(k); }
  refreshActions(item.p.id);
  renderCart();
});
document.getElementById("clearCart").onclick = () => {
  const ids = new Set();
  cart.forEach(item => ids.add(item.p.id));
  cart.clear();
  ids.forEach(refreshActions);
  renderCart();
};
function openDrawer(){ closeVmodal(); togglePanel(false); drawerOpen = true; renderCart(); drawer.classList.add("open"); syncOverlay(); }
function closeDrawer(){ drawerOpen = false; drawer.classList.remove("open"); syncOverlay(); }
cartBtnTop.onclick = openDrawer;
document.getElementById("closeDrawer").onclick = closeDrawer;
overlay.onclick = () => { closeDrawer(); togglePanel(false); closeVmodal(); };

/* ----- "Seguir comprando": cierra el carrito y resalta el botón del menú superior ----- */
let pulseTimer = null;
document.getElementById("keepShopping").onclick = () => {
  closeDrawer();
  /* dispara la animación pulse/glow en el botón del carrito superior */
  cartBtnTop.classList.remove("pulse");
  void cartBtnTop.offsetWidth; /* reinicia la animación si se repite */
  cartBtnTop.classList.add("pulse");
  clearTimeout(pulseTimer);
  pulseTimer = setTimeout(() => cartBtnTop.classList.remove("pulse"), 1300);
};

/* ----- whatsapp ----- */
document.getElementById("waDirect").href =
  "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent("¡Hola! Quiero hacerles una consulta.");

document.getElementById("waBtn").onclick = () => {
  if(cart.size === 0) return;
  let lines = ["¡Hola! Quiero hacer este pedido:", ""];
  let total = 0;
  cart.forEach(({p, variant, qty}) => {
    const sub = p.pr * qty;
    total += sub;
    /* La variante viaja entre paréntesis junto al nombre: Nombre Producto (Aroma) */
    const name = p.n + (variant ? ` (${variant})` : "");
    /* Se usan guion y ':' para máxima compatibilidad de caracteres en WhatsApp */
    lines.push(`- ${qty} x ${name} : ${fmt(sub)}`);
  });
  lines.push("", `*Total: ${fmt(total)}*`);
  const url = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(lines.join("\n"));
  window.open(url, "_blank");
};

buildPills();
render();
updateBadge();

</script>
